<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; worker-src 'self';">
  <title>Sprite (ALPHA)</title> <!-- main.js adds the version -->
  <!-- Link previews (Discord, Slack, social) need absolute URLs; the crawlers do not run the app, so the tags live here. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="SPRITE: Micro-pixels">
  <meta name="description" content="A fast, lightweight, keyboard-first, retro-modern micro-pixel editor and animation tool. No install bloat, no cloud lock-in: just a focused tool for tiny canvases.">
  <meta property="og:description" content="A fast, lightweight, keyboard-first, retro-modern micro-pixel editor and animation tool. No install bloat, no cloud lock-in: just a focused tool for tiny canvases.">
  <meta property="og:url" content="https://xanderstagwood.github.io/sprite/">
  <meta property="og:image" content="https://xanderstagwood.github.io/sprite/link-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="src/style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="canvas-area">
      <canvas id="sprite-canvas"></canvas>
    </div>

    <div id="timeline-trigger" class="edge-trigger edge-trigger-top"></div>
    <div id="timeline-bar" class="panel-overlay panel-overlay-top panel-hidden"></div>

    <div id="project-trigger" class="edge-trigger edge-trigger-left"></div>
    <div id="project-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>
    <div id="export-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>
    <div id="open-project-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>

    <div id="layers-panel" class="side-panel panel-overlay panel-overlay-right panel-hidden"></div>
    <div id="layers-trigger" class="edge-trigger edge-trigger-right"></div>

    <div id="palette-trigger" class="edge-trigger edge-trigger-bottom"></div>
    <div id="palette-bar" class="panel-overlay panel-overlay-bottom"></div>

    <div id="help-tag"></div>
    <div id="tool-tag"></div>
  </div>
  <script>
    // A failed startup otherwise leaves a blank page with the reason only in
    // the console; print the errors on the page, selectable, with Copy/Close.
    for (const type of ['error', 'unhandledrejection']) {
      window.addEventListener(type, (e) => {
        const reason = e.reason || e.error;
        const text = (reason && reason.stack) || (reason && reason.message) || e.message || String(reason);
        let box = document.getElementById('startup-error');
        if (!box) {
          box = document.body.appendChild(document.createElement('div'));
          box.id = 'startup-error';
          box.style.cssText = 'position:fixed;inset:0 0 auto 0;z-index:99999;padding:8px;background:#7A0C18;color:#fff;font:12px monospace';
          const bar = box.appendChild(document.createElement('div'));
          for (const [label, act] of [['Copy', () => navigator.clipboard.writeText(box.querySelector('pre').textContent)], ['Close', () => box.remove()]]) {
            const b = bar.appendChild(document.createElement('button'));
            b.textContent = label;
            b.style.cssText = 'margin-right:8px;font:inherit';
            b.onclick = act;
          }
          const pre = box.appendChild(document.createElement('pre'));
          pre.style.cssText = 'margin:6px 0 0;max-height:50vh;overflow:auto;white-space:pre-wrap;user-select:text';
        }
        const pre = box.querySelector('pre');
        pre.textContent += (pre.textContent ? '\n\n' : '') + text;
      });
    }
  </script>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
  </script>
</body>
</html>
